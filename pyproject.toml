[project]
name = "brief"
version = "0.1.0"
description = "AI Daily Brief: editorial, media and publishing toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=11",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# Local narration engine (ADR-004): `uv sync --extra tts`. Kept optional so tests and CI
# don't need PyTorch. Versions match the P1-05 benchmark.
tts = [
    "kokoro==0.9.4",
    "misaki==0.9.4",
    "soundfile==0.14.0",
    # spaCy English model for misaki, pinned so misaki never runs `spacy.cli.download`.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
brief = "brief.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the pinned spaCy model wheel above

[tool.hatch.build.targets.wheel]
packages = ["brief"]

[tool.uv]
# Supply-chain guard: resolve only package versions published at least ~14 days
# before this date. Move it forward deliberately when upgrading dependencies.
exclude-newer = "2026-10-25T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["brief"]

[[tool.mypy.overrides]]
# Optional `tts` extra: untyped, and absent when the extra isn't installed.
module = ["kokoro", "kokoro.*", "soundfile", "numpy", "numpy.*", "huggingface_hub"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.2",
]
