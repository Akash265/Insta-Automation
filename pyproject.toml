[project]
name = "brief"
version = "0.1.0"
description = "AI Daily Brief: editorial, media and publishing toolkit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
brief = "brief.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brief"]

[tool.uv]
# Supply-chain guard: resolve only package versions published at least ~14 days
# before this date. Move it forward deliberately when upgrading dependencies.
exclude-newer = "2026-10-25T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
