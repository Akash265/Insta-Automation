# LLM models and routes (ADR-003). Read by brief/llm/client.py.
#
# Prices: Anthropic pricing page, read 2026-11-07 (ADR-003), USD per million tokens.
# Thinking tokens are billed as output. Haiku 5.5 is billed at the long-context price
# for the whole request above 100,000 input tokens, so the client refuses such prompts.
#
# Routes v1: set from the P1-09 bake-off (founder decision 2026-11-13, ADR-003;
# evidence in research/llm-bakeoff/results.md). The router (P3-01) reads them.

models:
  claude-haiku-5-5:
    provider: anthropic
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.50
    max_input_tokens: 100000      # Haiku guard: stay under the long-context price
  claude-sonnet-5-5:
    provider: anthropic
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
  claude-opus-5-5:
    provider: anthropic
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    evaluation_only: true         # never allowed in a production route
  gemma4:e4b:
    provider: ollama
  qwen2.5:7b:
    provider: ollama

routes:                           # v1, 2026-11-13 (P1-09); prompt versions in brief/llm/prompts/
  # The local tier failed the quality criterion (89% vs >= 95% agreement), so T1/T2 go to
  # Haiku by config. qwen2.5:7b is re-tested in P2-17 on the labelled set.
  T1_tagging: {primary: claude-haiku-5-5, effort: low, prompt: tag.v1}
  T2_same_event: {primary: claude-haiku-5-5, effort: low, prompt: same_event.v1}
  T4_triage: {primary: claude-haiku-5-5}                  # not tested in P1-09
  # Editor-rated: Haiku claim precision 92% vs Sonnet 81%; scripts tied (4.5/5, all
  # publishable). The critic is a different, stronger model than the drafter.
  T5_claims: {primary: claude-haiku-5-5, effort: medium, prompt: claims.v2}
  T6_script: {primary: claude-haiku-5-5, effort: medium, prompt: script.v2}
  T7_critic: {primary: claude-sonnet-5-5, effort: high, prompt: critic.v1,
              budget_ladder_fallback: claude-haiku-5-5}
