# Static site settings (P1-11, ADR-006). Read by `brief site build`.

# Absolute site URL, no trailing slash: the Pages project `ai-daily-brief` (P1-12), which
# Cloudflare serves at `ai-daily-brief-7vb.pages.dev` (the plain name was taken), until a
# domain is chosen (OD-01). Edition `issue_url` values must match it.
base_url: https://ai-daily-brief-7vb.pages.dev

# Working title until OD-01 is settled (same as video_templates/theme.yaml).
site_name: AI Daily Brief
description: A short daily brief on AI news, with every story linked to its original source.
language: en

# true during the private validation experiment: every page carries `noindex`, robots.txt
# disallows crawling and Pages sends `X-Robots-Tag: noindex`. Set false only for the
# soft-launch build after gate G4 (P1-20).
noindex: true

# Shown on /contact/; required for the indexable build (P1-20U).
contact_email: akash265457k@gmail.com

# Founder approval date (YYYY-MM-DD) for each policy page's text (P1-20U). A page without
# a date shows a "Draft page" note, and `noindex: false` refuses to build until all are set.
policy_pages:
  about: 2026-11-14
  editorial-standards: 2026-11-14
  corrections-policy: 2026-11-14
  privacy: 2026-11-14
  contact: 2026-11-14
