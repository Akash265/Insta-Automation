  # ------------------------------------------------------------- tier 1: research
  - key: arxiv-ai
    name: arXiv cs.AI, cs.CL, cs.LG, cs.CV
    publisher: arXiv
    source_type: arxiv
    tier: 1
    category: research
    base_url: https://arxiv.org/
    feed_url: https://rss.arxiv.org/rss/cs.AI+cs.CL+cs.LG+cs.CV
    fetch_interval_minutes: 360
    terms_note: Official arXiv RSS (no robots.txt on rss.arxiv.org); metadata is CC0, each paper has its own licence. Empty at weekends. High volume, so filtered by keyword and capped per day.

  # ------------------------------------------------------------- tier 1: open source
  - key: gh-transformers
    name: transformers releases
    publisher: Hugging Face (GitHub)
