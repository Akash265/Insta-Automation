    base_url: https://github.com/huggingface/transformers
    feed_url: https://api.github.com/repos/huggingface/transformers/releases?per_page=10
    fetch_interval_minutes: 120
    terms_note: GitHub REST API (no robots.txt on api.github.com; github.com's robots.txt disallows .atom feeds, so they are not used). Unauthenticated limit 60 requests/hour; we use 5 every 2 hours. The repo list is reviewed monthly.

