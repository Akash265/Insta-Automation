# Source allow-list (P1-01). DRAFT until the founder approves it in docs/EDITORIAL_CHARTER.md.
#
# Fields mirror the `sources` table (docs/DATABASE_DESIGN.md §4.1). Tiers and categories:
# docs/EDITORIAL_PIPELINE.md §2 and §3.1. Check every enabled source with
#   uv run brief sources check        (makes web requests: robots.txt + fetch + parse)
#
# What we take from every source (EDITORIAL_PIPELINE §2, DATABASE_DESIGN §1): the title,
# link, dates, a summary of at most 1,000 characters and verification excerpts of at most
# 300 characters. Copy is written in our own words (R09) and always links to the original.
# Login walls and bot protection are never bypassed. `terms_note` records what was
# checked; "robots allowed" means `brief sources check` found no rule against our URL
# (RFC 9309) on the date below. Terms of use were not reviewed clause by clause.
#
# Feeds and robots.txt verified: 2026-11-14.

sources:
  # ------------------------------------------------------------- tier 1: labs and companies
  - key: openai-news
    name: OpenAI News
    publisher: OpenAI
    source_type: rss
    tier: 1
    category: model_release
    base_url: https://openai.com/news/
    feed_url: https://openai.com/news/rss.xml
    terms_note: Official RSS feed; robots allowed. Many items are customer stories, filtered by the rubric.

  - key: anthropic-news
